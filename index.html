<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="kr-api-base" content="">
<title>Kitchen Rush · Pickleball arcade</title>
<meta name="description" content="Un doigt, un terrain, un échange de plus. Le jeu de pickleball arcade Kitchen Rush.">
<meta name="theme-color" content="#123c34"><link rel="icon" href="./icons/kr-favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./rally.css">
<script defer src="./config.js"></script><script defer src="./players.js"></script><script defer src="./rally-config.js"></script>
<script defer src="./game.js"></script><script defer src="./rally-rules.js"></script><script defer src="./rally-view.js"></script><script defer src="./rally-app.js"></script>
</head>
<body>
<a class="skip" href="#court">Aller au terrain / Skip to court</a>
<main class="layout">
<section class="intro">
<a class="brand" href="./">KITCHEN<span>RUSH<span class="brand-dot">●</span></span></a>
<div class="edition"><a href="?edition=fr" lang="fr">FR</a><a href="?edition=us" lang="en">USA / EN</a></div>
<p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="headline"></h1><p class="lead" data-i18n="intro"></p>
<div class="how"><span>↔</span><p data-i18n="controls"></p></div>
<p class="scoring" data-i18n="scoring"></p>
<fieldset class="setup" id="side-choice"><legend data-i18n="chooseSide"></legend><div class="setup-options">
<label><input id="side-left" type="radio" name="side" value="left" checked><strong data-i18n="leftSide"></strong><span data-i18n="leftRole"></span></label>
<label><input id="side-right" type="radio" name="side" value="right"><strong data-i18n="rightSide"></strong><span data-i18n="rightRole"></span></label>
</div></fieldset>
<fieldset class="setup" id="strategy-choice"><legend data-i18n="chooseStrategy"></legend><div class="setup-options">
<label><input id="strategy-build" type="radio" name="strategy" value="build" checked><strong data-i18n="buildTitle"></strong><span data-i18n="buildBrief"></span></label>
<label><input id="strategy-drive" type="radio" name="strategy" value="drive"><strong data-i18n="driveTitle"></strong><span data-i18n="driveBrief"></span></label>
</div><p class="source-note" data-i18n="strategySource"></p></fieldset>
<fieldset class="setup" id="role-choice"><legend data-i18n="chooseRole"></legend><div class="setup-options">
<label><input id="role-support" type="radio" name="role" value="support"><strong data-i18n="supportTitle"></strong><span data-i18n="supportBrief"></span></label>
<label><input id="role-creator" type="radio" name="role" value="creator" checked><strong data-i18n="creatorTitle"></strong><span data-i18n="creatorBrief"></span></label>
</div><p class="source-note" data-i18n="roleSource"></p></fieldset>
<button id="start" class="primary" data-i18n="play"></button>
<p id="connection" role="status"></p>
<details id="guide"><summary data-i18n="players"></summary><p data-i18n="fiction"></p><div id="roster"></div></details>
</section>
<section class="match" aria-label="Kitchen Rush">
<header class="hud"><div><small data-i18n="score"></small><strong id="score">0</strong></div><div><small data-i18n="level"></small><strong id="level">1</strong></div><div class="health"><small data-i18n="lives"></small><strong id="lives" aria-live="polite">♥ ♥ ♥</strong></div><button id="pause" aria-label="Pause" disabled>Ⅱ</button></header>
<p id="rush" class="rush" role="status"></p>
<div class="court-wrap"><canvas id="court" width="480" height="760" tabindex="0"></canvas><div id="splash"><p data-i18n="splash"></p><span>↔</span></div></div>
<div id="power" class="power" role="status" aria-live="polite"><strong id="power-name"></strong><span id="power-effect"></span><progress id="power-progress" max="1" value="0"></progress></div>
<p id="feedback" class="feedback" role="status"></p>
</section>
<section class="community">
<div class="ranking-head"><div><p class="eyebrow" data-i18n="world"></p><h2 data-i18n="ranking"></h2></div><button id="refresh" data-i18n="refresh"></button></div>
<p id="ranking-status" role="status"></p><ol id="ranking"></ol>
<form id="submit-score" hidden><label for="nickname" data-i18n="nickname"></label><input id="nickname" required maxlength="20" autocomplete="nickname"><button class="primary" data-i18n="save"></button><p id="submit-status" role="status"></p></form>
<details id="newsletter" hidden><summary data-i18n="newsletter"></summary><form id="signup"><label for="email" data-i18n="email"></label><input id="email" type="email" required autocomplete="email"><label class="consent"><input id="email-consent" type="checkbox" required><span data-i18n="consent"></span></label><input name="website" id="website" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true"><button data-i18n="subscribe"></button><p id="signup-status" role="status"></p></form></details>
<label class="consent analytics"><input id="metrics" type="checkbox"><span data-i18n="metrics"></span></label>
<footer><a href="https://github.com/carossst/KitchenRush">GitHub ↗</a><a href="./privacy.html" data-i18n="privacy"></a><a href="./terms.html" data-i18n="terms"></a></footer>
</section>
</main>
<dialog id="effect-dialog"><p class="eyebrow" data-i18n="newPower"></p><h2 id="effect-title"></h2><canvas id="effect-preview" width="280" height="90" aria-hidden="true" hidden></canvas><p id="effect-copy"></p><p class="muted" data-i18n="pausedHint"></p><button id="effect-close" class="primary" data-i18n="continue"></button></dialog>
<dialog id="result-dialog"><p class="eyebrow" data-i18n="finished"></p><h2 id="result-score"></h2><p id="result-copy"></p><button id="again" class="primary" data-i18n="again"></button><button id="result-close" data-i18n="seeRanking"></button></dialog>
</body></html>
