<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Rush - Poster</title>
<meta name="robots" content="noindex">
<style>
  @page { size: A4 portrait; margin: 0; }
  :root { --bg: #070b1f; --ink: #ffffff; --muted: #a8b4d8; --gold: #ffcc5c; --green: #3ce68c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #03050f; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px 0 24px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .bar button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #3e4e8a; background: #121a3a; color: var(--ink); cursor: pointer; }
  .bar button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1a1200; }
  .bar button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .sheet { container-type: inline-size; width: min(100vw - 32px, 210mm); aspect-ratio: 210 / 297; position: relative; overflow: hidden; border-radius: 1cqw;
    background: radial-gradient(60% 40% at 12% 0%, rgba(88,160,255,.35), transparent 70%), radial-gradient(60% 40% at 90% 0%, rgba(255,120,90,.25), transparent 70%), linear-gradient(180deg, #0a1030, #070b1f 60%, #0b1a2e);
    display: flex; flex-direction: column; align-items: center; padding: 7cqw 7cqw 6cqw; text-align: center; }
  h1 { margin: 0; font-size: 15cqw; line-height: .92; font-weight: 800; font-style: italic; letter-spacing: -.03em; text-transform: uppercase; text-shadow: 0 .6cqw 3cqw rgba(88,160,255,.45); }
  h1 span { display: block; background: linear-gradient(90deg, var(--green), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .tag { margin: 2.4cqw 0 0; font-size: 4.2cqw; font-weight: 700; }
  .sub { margin: 1cqw 0 0; font-size: 3.2cqw; color: var(--muted); }
  .mid { display: flex; align-items: center; justify-content: center; gap: 4cqw; margin: 3.5cqw 0; width: 100%; flex: 1; min-height: 0; }
  .shot { height: 100%; max-height: 100%; aspect-ratio: 390 / 844; object-fit: cover; border-radius: 3cqw; border: .7cqw solid #1b2a5c; box-shadow: 0 2cqw 6cqw rgba(0,0,0,.55), 0 0 6cqw rgba(60,230,140,.18); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2.6cqw; text-align: left; max-width: 52cqw; }
  li { font-size: 3.5cqw; line-height: 1.25; font-weight: 600; padding-left: 5.2cqw; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: .55cqw; width: 2.6cqw; height: 2.6cqw; border-radius: 50%; background: var(--green); box-shadow: 0 0 1.6cqw var(--green); }
  li small { display: block; font-weight: 500; color: var(--muted); font-size: 2.7cqw; margin-top: .4cqw; }
  .cta { display: flex; align-items: center; gap: 4cqw; background: rgba(255,255,255,.07); border: .3cqw solid rgba(255,255,255,.18); border-radius: 3cqw; padding: 3cqw 4cqw; }
  .qr { width: 24cqw; height: 24cqw; border-radius: 1.6cqw; background: #fff; padding: 1.2cqw; box-sizing: border-box; }
  .qr svg, .qr img { width: 100%; height: 100%; display: block; }
  .club { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .club label { font-size: 14px; color: var(--muted); }
  .club input { font: inherit; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #3e4e8a; background: #0b1230; color: var(--ink); min-width: 200px; }
  .club button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #3e4e8a; background: #121a3a; color: var(--ink); cursor: pointer; }
  .cta div { text-align: left; }
  .scan { margin: 0; font-size: 5.4cqw; font-weight: 800; color: var(--gold); }
  .url { margin: .8cqw 0 0; font-size: 3.2cqw; font-weight: 700; word-break: break-all; }
  .note { margin: .6cqw 0 0; font-size: 2.6cqw; color: var(--muted); }
  @media print { body { padding: 0; background: none; gap: 0; } .bar, .club { display: none; } .sheet { width: 210mm; height: 297mm; border-radius: 0; } html, body { background: none; } }
</style>
</head>
<body>
<div class="bar" role="group" aria-label="Language / Langue">
  <button data-l="fr" aria-pressed="true">Fran&ccedil;ais</button>
  <button data-l="en" aria-pressed="false">English</button>
  <button id="print">Imprimer / Print</button>
</div>
<form class="club bar" id="club-form" autocomplete="off">
  <label for="club-name" id="club-label"></label>
  <input id="club-name" maxlength="40">
  <button type="submit" id="club-go"></button>
</form>
<main class="sheet" id="sheet">
  <h1>Kitchen<span>Rush</span></h1>
  <p class="tag" id="tag"></p>
  <p class="sub" id="sub"></p>
  <div class="mid">
    <img class="shot" id="shot" alt="" width="390" height="844">
    <ul id="feat"></ul>
  </div>
  <div class="cta">
    <div class="qr" id="qr" role="img"></div>
    <div><p class="scan" id="scan"></p><p class="url"><a id="challenge-link" href="./?duel=deep">carossst.github.io/KitchenRush</a></p><p class="note" id="note"></p><p class="note" id="by"></p></div>
  </div>
</main>
<script src="./qr-vendor.js"></script>
<script>
(function () {
  var T = {
    fr: { tag: "L'arcade du pickleball", sub: "Visez vos coups, maîtrisez la cuisine, grimpez l'échelle.", scan: "Scannez pour relever le défi", note: "Dans le navigateur, sur téléphone ou ordinateur.", qrAlt: "QR code pour ouvrir Kitchen Rush", clubLabel: "Nom du club ou du coach (facultatif)", clubGo: "Mettre \u00e0 jour le QR", by: "Propos\u00e9 par {name}", shotAlt: "Capture d'un match de Kitchen Rush",
      feat: [["Duel en simple ou en double", "Choisissez votre côté et votre partenaire IA"], ["Ralenti à la frappe", "Vous choisissez où va la balle"], ["Défi de cinq balles", "Visez la zone et gagnez des jetons Rush"], ["Le duel du jour", "Un adversaire pour tout le monde, à partager"]] },
    en: { tag: "The pickleball arcade", sub: "Aim your shots, own the Kitchen, climb the ladder.", scan: "Scan for the challenge", note: "In your browser, on phone or computer.", qrAlt: "QR code to open Kitchen Rush", clubLabel: "Club or coach name (optional)", clubGo: "Update the QR", by: "Offered by {name}", shotAlt: "Screenshot of a Kitchen Rush match",
      feat: [["Singles or doubles Duel", "Pick your side and your AI partner"], ["Slow motion at contact", "You choose where the ball goes"], ["Five-ball challenge", "Hit the target and earn Rush Tokens"], ["The Daily Duel", "One opponent for everyone, shareable"]] }
  };
  var q = ""; try { q = new URLSearchParams(location.search).get("lang") || ""; } catch (e) { }
  var lang = (q === "en" || q === "fr") ? q : (/^fr/i.test(navigator.language || "") ? "fr" : "en");
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
  // A club or coach name (?club=...) tags the QR link (?src=club-...) so a pilot can be measured; only [a-z0-9-] goes into the link.
  var club = ""; try { club = (new URLSearchParams(location.search).get("club") || "").trim().slice(0, 40); } catch (e) { }
  function slugOf(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32); }
  function targetUrl(l) {
    var base = location.origin + location.pathname.replace(/poster\.html$/, ""), slug = slugOf(club), u = l === "fr" ? base + "fr.html?duel=deep" : base + "?lang=en&duel=deep";
    return slug ? u + "&src=club-" + slug : u;
  }
  function renderQr(l) {
    var box = document.getElementById("qr"), url = targetUrl(l);
    document.getElementById("challenge-link").href = url;
    box.setAttribute("aria-label", T[l].qrAlt); box.setAttribute("data-url", url); box.innerHTML = "";
    try { if (typeof qrcode === "function") { var q = qrcode(0, "M"); q.addData(url); q.make(); box.innerHTML = q.createSvgTag(4, 0, T[l].qrAlt); return; } } catch (e) { }
    var img = document.createElement("img"); img.src = "icons/qr-" + l + ".svg"; img.alt = T[l].qrAlt; box.appendChild(img);   // untagged fallback
  }
  function apply(l) {
    var t = T[l]; lang = l; document.documentElement.lang = l;
    document.getElementById("tag").textContent = t.tag; document.getElementById("sub").textContent = t.sub;
    document.getElementById("scan").textContent = t.scan; document.getElementById("note").textContent = t.note;
    document.getElementById("feat").innerHTML = t.feat.map(function (f) { return "<li>" + esc(f[0]) + "<small>" + esc(f[1]) + "</small></li>"; }).join("");
    document.getElementById("club-label").textContent = t.clubLabel; document.getElementById("club-go").textContent = t.clubGo;
    document.getElementById("by").textContent = club ? t.by.replace("{name}", club) : "";
    renderQr(l);
    var sh = document.getElementById("shot"); sh.src = "icons/poster-duel-" + l + ".jpg"; sh.alt = t.shotAlt;
    document.querySelectorAll(".bar [data-l]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-l") === l ? "true" : "false"); });
    document.title = "Kitchen Rush - Poster (" + l.toUpperCase() + ")";
  }
  document.querySelectorAll(".bar [data-l]").forEach(function (b) { b.addEventListener("click", function () { apply(b.getAttribute("data-l")); }); });
  document.getElementById("print").addEventListener("click", function () { window.print(); });
  document.getElementById("club-name").value = club;
  document.getElementById("club-form").addEventListener("submit", function (e) {
    e.preventDefault(); club = document.getElementById("club-name").value.trim().slice(0, 40);
    try { var p = new URLSearchParams(location.search); if (club) p.set("club", club); else p.delete("club"); history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : "")); } catch (e2) { }
    apply(lang);
  });
  apply(lang);
})();
</script>
</body>
</html>
